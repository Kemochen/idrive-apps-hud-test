<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adaptive navigation HUD simulator</title>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: dark; font: 16px/1.4 system-ui, sans-serif; background: #111419; color: #edf2f8; }
    body { max-width: 47rem; margin: auto; padding: clamp(1rem, 4vw, 2rem); }
    h1 { margin: 0; font-size: 1.45rem; }
    p { margin: .5rem 0 1rem; color: #c5d0df; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; margin-bottom: 1rem; }
    button, select { font: inherit; min-height: 2.6rem; color: inherit; background: #222b36; border: 1px solid #586d82; border-radius: .35rem; padding: .4rem .65rem; }
    button:disabled { opacity: .5; }
    button:focus-visible, select:focus-visible { outline: 2px solid #88cdff; outline-offset: 2px; }
    #display { position: relative; isolation: isolate; overflow: hidden; min-height: 280px; background: #05070a; border: 1px solid #415369; border-radius: .6rem; }
    #card { position: absolute; z-index: 2; top: 12%; left: 8%; max-width: 42%; color: #fff; }
    #arrow, #distance { font-size: clamp(1.1rem, 4vw, 1.8rem); }
    #street { display: block; overflow-wrap: break-word; color: #c8d2de; }
    #map { position: absolute; top: 7%; left: 26%; width: 65%; height: 76%; overflow: hidden; pointer-events: none; }
    #lanes { position: absolute; right: 8%; bottom: 8%; display: flex; color: #9da8b7; }
    #lanes[hidden] { display: none; }
    .lane { padding: 0 .43rem; font-size: clamp(.85rem, 2.9vw, 1.1rem); }
    .lane + .lane { border-left: 1px dashed #8c9bae; }
    .take { color: #fff; font-weight: 650; }
    #speed { position: absolute; left: 8%; bottom: 8%; font-size: 1.5rem; }
    #warning { position: absolute; inset: 38% 0 auto; text-align: center; background: #271218; color: #ffadb8; padding: .7rem; }
    #status { display: block; margin-top: .6rem; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <h1>Adaptive navigation HUD simulator</h1>
  <p>Synthetic route and vehicle data</p>
  <div class="controls">
    <label for="scenario">Scenario</label><select id="scenario"></select>
    <button type="button" id="back">Previous</button><button type="button" id="next">Next</button>
    <button type="button" id="play">Play</button>
  </div>
  <div id="display" aria-label="Simulated head-up display">
    <svg id="map" viewBox="-130 -105 260 210" width="300" height="210" aria-label="Simulated local road geometry" role="img" hidden></svg>
    <div id="card" hidden><span id="arrow"></span> <span id="distance"></span><span id="street"></span></div>
    <div id="lanes" aria-label="Lane guidance" hidden></div>
    <div id="speed"></div>
    <div id="warning" hidden>BMW warning</div>
  </div>
  <output id="status" aria-live="polite"></output>
  <!-- PREVIEW_CODE -->
</body>
</html>
